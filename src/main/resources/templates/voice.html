<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrishiVaani - Voice Assistant</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div class="container">

        <h1>🌾 KrishiVaani</h1>

        <h2>Voice Assistant</h2>

        <p>Click the microphone and speak.</p>

        <button id="start-btn">
            🎤 Start Voice
        </button>

        <br><br>

        <textarea
            id="result"
            rows="8"
            cols="50"
            placeholder="Your speech will appear here..."
            readonly>
        </textarea>

    </div>
    <script src="/js/voice.js"></script>
</body>
</html>
